name: Lint: PEP8 + Ruff

on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/**'
      - 'pyproject.toml'

jobs:
  lint:
    name: PEP8 and Ruff Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run Ruff Lint and Format Check
        uses: astral-sh/ruff-action@v3
        with:
          version: '>=0.4.0'
          args: 'check --diff'

      - name: Run Ruff Format Check
        uses: astral-sh/ruff-action@v3
        with:
          version: '>=0.4.0'
          args: 'format --check --diff'
